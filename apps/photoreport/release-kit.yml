schema_version: 2

identity:
  app_name: "JOVFX"
  operator: "独立开发者"
  bundle_id: "com.jovfx.lite"
  android_package: "com.jovfx.lite"

contact:
  support_email: "PadonSolmonson469@outlook.com"
  support_url: "https://jovfx1.com/?lang=en#support"
  production_domain: "https://jovfx1.com"

platforms:
  ios:
    iphone: true
    ipad: true
  android:
    phone: true

listing:
  shared_full_description: artifacts/app-store-listing/description-en.txt
  app_store:
    primary_locale: en-US
  google_play:
    primary_locale: en-US
    localized_graphics:
      - en-US
      - zh-CN
  tone: clear, specific, trustworthy

privacy:
  effective_date: "2026-11-17"
  urls:
    en: "https://jovfx1.com/privacy.html?lang=en"
    zh-Hans: "https://jovfx1.com/privacy.html?lang=zh"
  confirmed:
    - "No account is required for the implemented app flows."
    - "Projects, records, photos, annotations, generated PDFs, and backups are handled on device by default."
    - "Camera and photo-library access are requested only for user-initiated capture or import."
    - "The current dependency set contains no advertising or behavioral analytics SDK."
    - "The app hands PDF or backup exports to the system share interface after a user action."
    - "Manual backup files contain project and record data, photos, and annotations. Generated PDFs are excluded."
    - "The app opens the official privacy policy in the system browser only when requested and passes the page URL with the chosen language."

website:
  marketing_url: "https://jovfx1.com/"
  default_locale: en
  locales:
    - en
    - zh-Hans

screenshots:
  source_policy: real-runtime-only
  app_store:
    locale: en-US
    preview_spec: artifacts/app-store-previews/preview-spec.json
  google_play:
    locales:
      - en-US
      - zh-CN
    preview_spec: artifacts/google-play-listing/preview-spec.json

paths:
  app_root: "apps/photoreport"
