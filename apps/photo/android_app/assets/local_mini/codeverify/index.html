<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover,maximum-scale=1.0, user-scalable=no"
    />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />
    <link rel="mask-icon" href="./safari-pinned-tab.svg" color="#f6d2d2" />
    <meta name="msapplication-TileColor" content="#f6d2d2" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <script>
      ;(function () {
        function wrap(name) {
          var handlers = window.webkit && window.webkit.messageHandlers
          var h = handlers && handlers[name]
          if (!h || h.__stJsonWrapped) return
          var orig = h.postMessage.bind(h)
          h.postMessage = function (body) {
            if (typeof body === 'string') return orig(body)
            try { return orig(JSON.stringify(body)) } catch (e) { return orig(String(body)) }
          }
          h.__stJsonWrapped = true
        }
        wrap('CMSScriptMessageChannel')
        wrap('jsFunction')
        wrap('STBridge')
      })()
    </script>
    <script src="./assets/index.js"></script>
    <link rel="stylesheet" href="./assets/style.css">
    <link rel="sitemap" type="application/xml" title="Sitemap" href="./sitemap.xml">
  </head>
  <body>
    <div id="app"></div>
    <script src="./polymer/env/env.js"></script>
    <noscript> This website requires JavaScript to function properly. Please enable JavaScript to continue. </noscript>
  </body>
</html>
