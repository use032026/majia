name: trip_cost
description: Travel purchase cost, payment comparison, and budget assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  drift: ^2.28.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  intl: ^0.20.2
  image_picker: ^1.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  sealed_countries: ^2.8.0
  sealed_currencies: ^2.5.0
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: ^0.5.42
  url_launcher: ^6.3.2
  uuid: ^4.6.0

dev_dependencies:
  build_runner: 2.4.14
  drift_dev: 2.28.0
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  pigeon: ^26.1.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/branding/launch_mark.png
    - assets/onboarding/
