# RhinoSmart FLUTTER APP CONFIG: signing material is supplied by the protected
# tripcost-production GitHub Environment.
schema_version: 2

release:
  allowed_events:
    - workflow_dispatch
  allowed_ref_patterns:
    - refs/heads/main
    - refs/heads/release/*
    - refs/tags/ios-v*

app:
  name: RhinoSmart
  team_id: Z353FCBY9T
  asc_app_id: "6803728146"
  primary_bundle_id: com.tripcost.lite
  bundle_ids:
    - bundle_id: com.tripcost.lite
      target: Runner
      profile_alias: app
    - bundle_id: com.tripcost.lite.widget
      target: AppWidget
      profile_alias: widget

flutter:
  project_directory: apps/tripcost
  version: 3.35.7
  channel: stable
  architecture: arm64
  sdk_sha256: 4d7aaadc4893f9216d4e2ecbe0e8fb4213e9bd49d29fd5f441f34fcc05758e2b

build:
  container_type: workspace
  container_path: apps/tripcost/ios/Runner.xcworkspace
  scheme: Run-Release
  configuration: Release
  runner: macos-26
  xcode_path: /Applications/Xcode_26.4.app
  dependency_mode: flutter
  dependency_command: ""

versioning:
  marketing_version_source: input
  build_number_strategy: github_run_number
  build_number_override_allowed: true

export:
  method: app-store-connect
  upload_symbols: true
  strip_swift_symbols: true

upload:
  enabled_by_default: false
  asc_key_type: team
  wait_level: asc_appeared
  timeout_minutes: 45
  poll_interval_seconds: 30
  internal_beta_group_ids: []

artifacts:
  retention_days: 30
  keep_xcarchive: false
