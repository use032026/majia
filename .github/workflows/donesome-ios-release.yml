name: Hearthio iOS Release

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Three-component version to build, for example 1.0.2
        required: true
        default: 1.0.0
        type: string
      build_number:
        description: Optional positive integer; ASC increments it when left empty during upload
        required: false
        type: string
      upload_to_asc:
        description: Upload the validated IPA and wait for ASC processing
        required: true
        default: false
        type: boolean
      auto_create_store_version:
        description: Create or reuse the App Store version after upload without submitting it
        required: true
        default: false
        type: boolean
      submit:
        description: Submit the created or reused store version to App Review after processing
        required: true
        default: false
        type: boolean
      update_asc_text_metadata:
        description: Update only text fields declared in the app metadata manifest
        required: true
        default: false
        type: boolean
      replace_asc_media:
        description: Replace only screenshot/preview collections declared in the app metadata manifest
        required: true
        default: false
        type: boolean
      release_notes_json:
        description: 'Optional whats_new override; requires update_asc_text_metadata=true, for example {"en-US":"Bug fixes."}'
        required: false
        default: "{}"
        type: string

permissions:
  contents: read

concurrency:
  group: majia-asc-hearthio-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    environment: hearthio-production
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Ruby toolchain
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3.0"
          bundler-cache: true
          working-directory: apps/donesome/Hearthio

      - name: Prepare Environment-backed release inputs
        id: prepare
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_SCHEME: ${{ vars.IOS_SCHEME }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          UPLOAD_TO_ASC: ${{ inputs.upload_to_asc }}
          AUTO_CREATE_STORE_VERSION: ${{ inputs.auto_create_store_version }}
          SUBMIT: ${{ inputs.submit }}
          UPDATE_ASC_TEXT_METADATA: ${{ inputs.update_asc_text_metadata }}
          REPLACE_ASC_MEDIA: ${{ inputs.replace_asc_media }}
          RELEASE_NOTES_JSON: ${{ inputs.release_notes_json }}
        run: |
          ruby .github/scripts/prepare-environment-ios-release.rb \
            --app-key hearthio \
            --app-name LAURUS \
            --project-directory apps/donesome/Hearthio \
            --container-path apps/donesome/Hearthio/ios/Runner.xcworkspace \
            --targets-json '[{"suffix":"","target":"Runner","profile_alias":"app"}]' \
            --marketing-version "$MARKETING_VERSION" \
            --upload-to-asc "$UPLOAD_TO_ASC" \
            --auto-create-store-version "$AUTO_CREATE_STORE_VERSION" \
            --submit "$SUBMIT" \
            --update-asc-text-metadata "$UPDATE_ASC_TEXT_METADATA" \
            --replace-asc-media "$REPLACE_ASC_MEDIA" \
            --metadata-template apps/donesome/Hearthio/app-store/metadata.yml \
            --release-notes-json "$RELEASE_NOTES_JSON" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build, retain, and optionally release Hearthio
        id: release
        uses: CherryIce/ios-multi-app-cloud-build-system/.github/actions/build-upload@39a136d4c560879ec35f3fd23c44f0b1eae4bc30
        with:
          config_path: ${{ steps.prepare.outputs.config_path }}
          marketing_version: ${{ inputs.marketing_version }}
          build_number: ${{ inputs.build_number }}
          upload_to_asc: ${{ inputs.upload_to_asc }}
          submit_to_review: "false"
          update_asc_text_metadata: ${{ inputs.update_asc_text_metadata }}
          replace_asc_media: ${{ inputs.replace_asc_media }}
          ios_distribution_p12_base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          ios_distribution_p12_password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          ios_profiles_archive_base64: ${{ steps.prepare.outputs.profiles_archive_base64 }}
          asc_api_key_p8_base64: ${{ steps.prepare.outputs.asc_api_key_p8_base64 }}
          asc_key_id: ${{ vars.ASC_KEY_ID }}
          asc_issuer_id: ${{ vars.ASC_ISSUER_ID }}

      - name: Submit prepared App Store version for review
        id: submit_review
        if: ${{ inputs.submit }}
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          ruby .github/scripts/submit-asc-review.rb \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$MARKETING_VERSION" \
            --output asc-review-submission.json \
            --github-output "$GITHUB_OUTPUT" \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Retain review submission evidence
        if: ${{ always() && inputs.submit }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asc-review-submission-hearthio-${{ github.run_id }}-${{ github.run_attempt }}
          path: asc-review-submission.json
          if-no-files-found: warn
          retention-days: 30

      - name: Write release evidence summary
        if: ${{ always() }}
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.marketing_version }}
          REQUESTED_UPLOAD: ${{ inputs.upload_to_asc }}
          REQUESTED_STORE_VERSION: ${{ inputs.auto_create_store_version }}
          REQUESTED_SUBMIT: ${{ inputs.submit }}
          REQUESTED_TEXT_METADATA: ${{ inputs.update_asc_text_metadata }}
          REQUESTED_MEDIA_REPLACEMENT: ${{ inputs.replace_asc_media }}
          RESOLVED_BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          ASC_PROCESSING_STATE: ${{ steps.release.outputs.asc_processing_state }}
          APP_STORE_VERSION_STATE: ${{ steps.release.outputs.app_store_version_state }}
          REVIEW_SUBMISSION_STATE: ${{ steps.submit_review.outputs.review_submission_state }}
          REVIEW_SUBMITTED: ${{ steps.submit_review.outputs.review_submitted }}
          SUBMISSION_NO_OP: ${{ steps.submit_review.outputs.submission_no_op }}
          SUBMISSION_NO_OP_REASON: ${{ steps.submit_review.outputs.submission_no_op_reason }}
          APP_STORE_NO_OP: ${{ steps.release.outputs.app_store_no_op }}
          APP_STORE_NO_OP_REASON: ${{ steps.release.outputs.app_store_no_op_reason }}
          ASC_TEXT_METADATA_UPDATED: ${{ steps.release.outputs.asc_text_metadata_updated }}
          ASC_MEDIA_REPLACED: ${{ steps.release.outputs.asc_media_replaced }}
        run: |
          {
            echo "## Hearthio iOS release"
            echo "- Marketing version: ${REQUESTED_VERSION}"
            echo "- Build number: ${RESOLVED_BUILD_NUMBER:-not-built}"
            echo "- Upload requested: ${REQUESTED_UPLOAD}"
            echo "- Store version create/reuse requested: ${REQUESTED_STORE_VERSION}"
            echo "- Review submission requested: ${REQUESTED_SUBMIT}"
            echo "- Text metadata update requested: ${REQUESTED_TEXT_METADATA}"
            echo "- Media replacement requested: ${REQUESTED_MEDIA_REPLACEMENT}"
            echo "- ASC processing state: ${ASC_PROCESSING_STATE:-not-uploaded}"
            echo "- App Store version state: ${APP_STORE_VERSION_STATE:-not-created}"
            echo "- Review submitted: ${REVIEW_SUBMITTED:-false}"
            echo "- Review submission state: ${REVIEW_SUBMISSION_STATE:-not-submitted}"
            echo "- Review submission no-op: ${SUBMISSION_NO_OP:-false}"
            echo "- Review submission no-op reason: ${SUBMISSION_NO_OP_REASON:-none}"
            echo "- App Store no-op: ${APP_STORE_NO_OP:-false}"
            echo "- App Store no-op reason: ${APP_STORE_NO_OP_REASON:-none}"
            echo "- Text metadata updated and verified: ${ASC_TEXT_METADATA_UPDATED:-false}"
            echo "- Media replaced and verified: ${ASC_MEDIA_REPLACED:-false}"
            echo "- Release policy: automatic after Apple approval"
          } >> "$GITHUB_STEP_SUMMARY"
