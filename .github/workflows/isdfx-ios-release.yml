name: ISDFX iOS Release
run-name: ISDFX iOS ${{ inputs.marketing_version }} (${{ inputs.build_number }})

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Three-component marketing version to build
        required: true
        default: "1.0.0"
        type: string
      build_number:
        description: Exact build number to use
        required: true
        type: string
      upload_to_asc:
        description: Upload the validated IPA and wait for ASC processing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: majia-asc-isdfx-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'use032026/majia' && github.ref == 'refs/heads/main'
    environment: isdfx-production
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare ISDFX release inputs
        id: prepare
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_SCHEME: ${{ vars.IOS_SCHEME }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          UPLOAD_TO_ASC: ${{ inputs.upload_to_asc }}
        run: |
          set -euo pipefail
          [[ "$IOS_BUNDLE_ID" == 'com.isdfx.lite' && "$IOS_SCHEME" == 'Runner' ]] || {
            echo 'The ISDFX environment must use bundle ID com.isdfx.lite and scheme Runner.' >&2
            exit 1
          }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo 'The build number must be a positive integer.' >&2
            exit 1
          }
          ruby .github/scripts/prepare-environment-ios-release.rb \
            --app-key isdfx \
            --app-name ISDFX \
            --project-directory apps/isdfx \
            --container-path apps/isdfx/ios/Runner.xcworkspace \
            --targets-json '[{"suffix":"","target":"Runner","profile_alias":"app"}]' \
            --marketing-version "$MARKETING_VERSION" \
            --upload-to-asc "$UPLOAD_TO_ASC" \
            --auto-create-store-version false \
            --submit false \
            --update-asc-text-metadata false \
            --replace-asc-media false \
            --metadata-template apps/isdfx/app-store/metadata.yml \
            --release-notes-json '{}' \
            --github-output "$GITHUB_OUTPUT"

      - name: Select CocoaPods version from the committed lock
        shell: bash
        run: |
          set -euo pipefail
          pod_version="$(awk '/^COCOAPODS: / {print $2}' apps/isdfx/ios/Podfile.lock)"
          [[ "$pod_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$(pod --version)" != "$pod_version" ]]; then
            gem install cocoapods --version "$pod_version" --no-document --user-install
            pod_bin="$(ruby -rrubygems -e 'print Gem.user_dir')/bin"
            [[ "$("$pod_bin/pod" --version)" == "$pod_version" ]]
            echo "$pod_bin" >> "$GITHUB_PATH"
          fi
          echo "Using CocoaPods $pod_version"

      - name: Build, verify, and optionally upload ISDFX
        id: release
        uses: CherryIce/ios-multi-app-cloud-build-system/.github/actions/build-upload@b2a2e38df4eac58c35d1bf8b5dc7cc987be467d9
        with:
          config_path: ${{ steps.prepare.outputs.config_path }}
          marketing_version: ${{ inputs.marketing_version }}
          build_number: ${{ inputs.build_number }}
          upload_to_asc: ${{ inputs.upload_to_asc }}
          submit_to_review: "false"
          update_asc_text_metadata: "false"
          replace_asc_media: "false"
          ios_distribution_p12_base64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          ios_distribution_p12_password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          ios_profiles_archive_base64: ${{ steps.prepare.outputs.profiles_archive_base64 }}
          asc_api_key_p8_base64: ${{ steps.prepare.outputs.asc_api_key_p8_base64 }}
          asc_key_id: ${{ vars.ASC_KEY_ID }}
          asc_issuer_id: ${{ vars.ASC_ISSUER_ID }}

      - name: Write release evidence summary
        if: always()
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.marketing_version }}
          REQUESTED_BUILD_NUMBER: ${{ inputs.build_number }}
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          IPA_SHA256: ${{ steps.release.outputs.ipa_sha256 }}
          ASC_BUILD_ID: ${{ steps.release.outputs.asc_build_id }}
          ASC_UPLOAD_STATE: ${{ steps.release.outputs.asc_upload_state }}
          ASC_PROCESSING_STATE: ${{ steps.release.outputs.asc_processing_state }}
        run: |
          {
            echo '## ISDFX iOS release'
            echo '- Bundle ID: com.isdfx.lite'
            echo "- Source SHA: ${SOURCE_SHA:-not-built}"
            echo "- Marketing version: $REQUESTED_VERSION"
            echo "- Requested build number: $REQUESTED_BUILD_NUMBER"
            echo "- Build number: ${BUILD_NUMBER:-not-built}"
            echo "- IPA SHA-256: ${IPA_SHA256:-not-exported}"
            echo "- ASC build ID: ${ASC_BUILD_ID:-not-observed}"
            echo "- ASC upload state: ${ASC_UPLOAD_STATE:-not-observed}"
            echo "- ASC processing state: ${ASC_PROCESSING_STATE:-not-observed}"
          } >> "$GITHUB_STEP_SUMMARY"
