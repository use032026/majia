name: ASC Review Status

on:
  workflow_dispatch:
    inputs:
      app_environment:
        description: App whose protected ASC credentials and bundle ID should be used
        required: true
        type: choice
        options:
          - almanac-production
          - filepeek-production
          - tripcost-production
          - tripdelta-production
          - hearthio-production
          - sdpacket-production
          - steady-production
          - photo-production
          - plotproof_lab-production
          - cleantrail-production
          - langpack-production
      marketing_version:
        description: Optional App Store version, for example 1.0.0; leave empty for the latest iOS version
        required: false
        type: string
      include_store_metadata:
        description: Include a read-only metadata and media snapshot; requires an exact marketing version
        required: true
        default: false
        type: boolean
      build_inventory_version:
        description: Run only the read-only iOS upload and prerelease build inventory for this exact version
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: asc-review-status-${{ inputs.app_environment }}
  cancel-in-progress: false

jobs:
  query:
    environment: ${{ inputs.app_environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Query read-only ASC review status
        if: ${{ inputs.build_inventory_version == '' }}
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          ruby .github/scripts/query-asc-review-status.rb \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$MARKETING_VERSION" \
            --output asc-review-status.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Query read-only ASC store metadata and media
        if: ${{ inputs.build_inventory_version == '' && inputs.include_store_metadata }}
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          if [[ -z "${MARKETING_VERSION//[[:space:]]/}" ]]; then
            echo "::error::include_store_metadata=true requires an exact marketing_version"
            exit 1
          fi
          ruby .github/scripts/query-asc-store-metadata.rb \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$MARKETING_VERSION" \
            --output asc-store-metadata.json

      - name: Query read-only ASC build inventory
        if: ${{ inputs.build_inventory_version != '' }}
        shell: bash
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          INVENTORY_VERSION: ${{ inputs.build_inventory_version }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          INCLUDE_STORE_METADATA: ${{ inputs.include_store_metadata }}
        run: |
          if [[ -n "$MARKETING_VERSION" || "$INCLUDE_STORE_METADATA" == "true" ]]; then
            echo "::error::Build inventory mode cannot be combined with store status or metadata inputs"
            exit 1
          fi
          ruby .github/scripts/query-asc-review-status.rb \
            --bundle-id "$IOS_BUNDLE_ID" \
            --marketing-version "$INVENTORY_VERSION" \
            --build-inventory \
            --output asc-build-inventory.json \
            --github-summary "$GITHUB_STEP_SUMMARY"

      - name: Retain ASC status snapshot
        if: ${{ always() && (inputs.build_inventory_version == '' || success()) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: asc-review-status-${{ inputs.app_environment }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            asc-review-status.json
            asc-store-metadata.json
            asc-build-inventory.json
          if-no-files-found: error
          retention-days: 30
