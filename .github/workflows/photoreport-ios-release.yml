name: JOVFX iOS Release

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: Three-component version to build
        required: true
        default: "1.0.2"
        type: string
      build_number:
        description: Optional build number; ASC increments it when empty
        required: false
        type: string
      upload_to_asc:
        description: Upload the validated IPA and wait for ASC processing
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: majia-asc-photoreport-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  upload:
    if: github.repository == 'use032026/majia' && github.ref == 'refs/heads/main'
    environment: photoreport-production
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Prepare JOVFX build configuration
        id: prepare
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_SCHEME: Runner
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
          UPLOAD_TO_ASC: ${{ inputs.upload_to_asc }}
        run: |
          set -euo pipefail
          [[ "$IOS_BUNDLE_ID" == 'com.jovfx.lite' ]] || {
            echo 'The production environment bundle ID must be com.jovfx.lite.' >&2
            exit 1
          }
          ruby .github/scripts/prepare-environment-ios-release.rb \
            --app-key photoreport \
            --app-name JOVFX \
            --project-directory apps/photoreport \
            --container-path apps/photoreport/ios/Runner.xcworkspace \
            --targets-json '[{"suffix":"","target":"Runner","profile_alias":"app"}]' \
            --marketing-version "$MARKETING_VERSION" \
            --upload-to-asc "$UPLOAD_TO_ASC" \
            --auto-create-store-version false \
            --submit false \
            --update-asc-text-metadata false \
            --replace-asc-media false \
            --metadata-template apps/photoreport/app-store/metadata.yml \
            --release-notes-json '{}' \
            --github-output "$GITHUB_OUTPUT"

      - name: Select CocoaPods version from the committed lock
        shell: bash
        run: |
          set -euo pipefail
          pod_version="$(awk '/^COCOAPODS: / {print $2}' apps/photoreport/ios/Podfile.lock)"
          [[ "$pod_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$(pod --version)" != "$pod_version" ]]; then
            gem install cocoapods --version "$pod_version" --no-document --user-install
            pod_bin="$(ruby -rrubygems -e 'print Gem.user_dir')/bin"
            [[ "$("$pod_bin/pod" --version)" == "$pod_version" ]]
            echo "$pod_bin" >> "$GITHUB_PATH"
          fi
          echo "Using CocoaPods $pod_version"

      - name: Normalize distribution P12 for macOS Keychain
        id: signing
        shell: bash
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$(mktemp -d "$RUNNER_TEMP/photoreport-signing.XXXXXX")"
          trap 'rm -rf "$signing_dir"' EXIT
          printf '%s' "$IOS_DISTRIBUTION_P12_BASE64" | base64 -D > "$signing_dir/original.p12"
          P12_PASSWORD="$IOS_DISTRIBUTION_P12_PASSWORD" \
            openssl pkcs12 -legacy -in "$signing_dir/original.p12" \
              -passin env:P12_PASSWORD -nodes -out "$signing_dir/identity.pem"
          P12_PASSWORD="$IOS_DISTRIBUTION_P12_PASSWORD" \
            openssl pkcs12 -export -in "$signing_dir/identity.pem" \
              -out "$signing_dir/compatible.p12" -passout env:P12_PASSWORD \
              -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1
          normalized_p12="$(base64 < "$signing_dir/compatible.p12" | tr -d '\n')"
          echo "::add-mask::$normalized_p12"
          echo "p12_base64=$normalized_p12" >> "$GITHUB_OUTPUT"

      - name: Build, retain, and upload JOVFX
        id: release
        uses: CherryIce/ios-multi-app-cloud-build-system/.github/actions/build-upload@b2a2e38df4eac58c35d1bf8b5dc7cc987be467d9
        with:
          config_path: ${{ steps.prepare.outputs.config_path }}
          marketing_version: ${{ inputs.marketing_version }}
          build_number: ${{ inputs.build_number }}
          upload_to_asc: ${{ inputs.upload_to_asc }}
          submit_to_review: "false"
          update_asc_text_metadata: "false"
          replace_asc_media: "false"
          ios_distribution_p12_base64: ${{ steps.signing.outputs.p12_base64 }}
          ios_distribution_p12_password: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          ios_profiles_archive_base64: ${{ steps.prepare.outputs.profiles_archive_base64 }}
          asc_api_key_p8_base64: ${{ steps.prepare.outputs.asc_api_key_p8_base64 }}
          asc_key_id: ${{ vars.ASC_KEY_ID }}
          asc_issuer_id: ${{ vars.ASC_ISSUER_ID }}

      - name: Write upload evidence summary
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ steps.release.outputs.source_sha }}
          BUILD_NUMBER: ${{ steps.release.outputs.build_number }}
          IPA_SHA256: ${{ steps.release.outputs.ipa_sha256 }}
          ASC_BUILD_ID: ${{ steps.release.outputs.asc_build_id }}
          ASC_UPLOAD_STATE: ${{ steps.release.outputs.asc_upload_state }}
          ASC_PROCESSING_STATE: ${{ steps.release.outputs.asc_processing_state }}
        run: |
          {
            echo '## JOVFX release'
            echo '- Bundle ID: com.jovfx.lite'
            echo "- Source SHA: ${SOURCE_SHA:-unavailable}"
            echo "- Build number: ${BUILD_NUMBER:-unavailable}"
            echo "- IPA SHA-256: ${IPA_SHA256:-unavailable}"
            echo "- ASC build ID: ${ASC_BUILD_ID:-unavailable}"
            echo "- ASC upload state: ${ASC_UPLOAD_STATE:-unavailable}"
            echo "- ASC processing state: ${ASC_PROCESSING_STATE:-unavailable}"
          } >> "$GITHUB_STEP_SUMMARY"
